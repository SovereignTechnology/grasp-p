[package]
name = "grasp-audit"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Audit and compliance testing tool for GRASP protocol implementations"
license = "MIT"
repository = "https://gitworkshop.dev/danconwaydev.com/ngit-grasp"

[[bin]]
name = "grasp-audit"
path = "src/bin/grasp-audit.rs"

[dependencies]
# Nostr
nostr-sdk = "0.45.0-alpha.3"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
uuid = { version = "1", features = ["v4"] }

# HTTP Client — rustls (not native-tls). This crate is a dev-dependency of
# ngit-grasp, and reqwest features unify across the workspace: a native-tls
# here would re-link openssl-sys into the shipped relay binary. Keep it rustls.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
regex = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
