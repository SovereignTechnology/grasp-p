# =============================================================================
# ngit-grasp :: GRASP-P per-IP rate zones (blob upload / delete)
# =============================================================================
#
# WHAT THIS IS
#   Production drop-in adding per-IP rate limiting to the nginx vhost that
#   terminates TLS for git.<domain> and reverse-proxies ngit-grasp at
#   http://127.0.0.1:7334. Routes covered:
#     PUT|HEAD /upload          blob upload (BUD-01/BUD-06)   -> blobput zone
#     DELETE /<sha256>          blob delete (BUD-02)          -> blobdel zone
#     GET|HEAD /<sha256>        blob download                 -> passes through
#     GET /list/<pubkey>        descriptor list               -> passes through
#     /metrics                  Prometheus scrape             -> allowlist only
#     /                         relay WS + NIP-11 (existing vhost location,
#                               untouched by this file)
#
#   The /upload shape is the one PROVEN by the Phase-0 G6 gate
#   (scripts/phase0/g6_nginx_stream_shape.sh): a 256 MiB streamed PUT through
#       limit_req zone=blobput burst=20;
#       client_max_body_size 0;
#       proxy_request_buffering off;
#   delivers the first body byte to the upstream <2 s into a ~6 s throttled
#   transfer (no whole-request spooling), sha256+bytes verified end-to-end.
#   Do NOT regress client_max_body_size / proxy_request_buffering on /upload:
#   proxy_request_buffering "on" re-introduces full-body buffering in nginx
#   and breaks the streaming guarantee; a non-zero client_max_body_size would
#   413 large-but-legal blobs before the server can apply its own
#   NGIT_PRIVATE_MAX_BLOB_BYTES admission check.
#
# WHERE TO DROP IT (YunoHost-style layout)
#   /etc/nginx/nginx.conf includes:
#       http { ... include /etc/nginx/conf.d/*.conf; ... }              # HTTP ctx
#   and the git.<domain> vhost includes:
#       server { ... include /etc/nginx/conf.d/git.<domain>.d/*.conf; } # SERVER ctx
#
#   limit_req_zone / map / limit_req_status are only valid in the HTTP
#   context, so split this file at install time:
#     1. SECTION A  ->  /etc/nginx/conf.d/zz-ngit-grasp-zones.conf
#        (http context; name it zz-* so it loads after any app files that
#        reference the zones in server context)
#     2. SECTION B  ->  /etc/nginx/conf.d/git.<domain>.d/ngit-grasp-zones.conf
#        (server context, alongside the existing proxy locations)
#   Then: nginx -t && systemctl reload nginx
#
# TUNING GUIDANCE
#   * limit_req counts request STARTS per key (client IP), not bytes. One
#     256 MiB streamed upload costs exactly one token; byte-level abuse is
#     bounded server-side by NGIT_PRIVATE_MAX_BLOB_BYTES, the per-tenant
#     quotas, and NGIT_PRIVATE_GLOBAL_BUDGET_BYTES.
#   * blobput rate=10r/s burst=20 (G6 default) suits a small-team instance.
#     No `nodelay`: over-rate requests are QUEUED (delayed), not failed, so a
#     client pushing a batch of blobs concurrently is smoothed rather than
#     429'd. Add `nodelay` to fail fast instead; add a second limit_req line
#     for a two-tier shape. Public multi-tenant instances may want
#     rate=2r/s..5r/s; trusted LAN/VPN deploys can raise or drop the zone.
#   * blobdel rate=2r/s burst=5 is deliberately gentler: deletes are rare in
#     normal operation and a delete-flood is a plausible griefing vector.
#   * 10m zone ≈ 160k IPv4 states (64 B/state via $binary_remote_addr; IPv6
#     costs ~2x). Shrink to 1m (~16k IPs) on small VPSes.
#   * limit_req_status 429 (not the nginx default 503) lets Blossom/GRASP
#     clients distinguish throttling from server failure; clients already
#     handle 429 with backoff.
#   * Delayed (queued) requests hold a worker connection; with large bursts
#     and many IPs, watch worker_connections / worker_rlimit_nofile.
#
# KNOWN GAP — WebSocket-path per-IP event limiting
#   The relay WS endpoint (location /) has NO per-IP event-rate limiting at
#   the nginx layer (inherited from the relay-builder base; limit_req cannot
#   inspect individual frames inside a long-lived WS connection). The layers
#   that DO exist:
#     * per-write-key token bucket INSIDE ngit-grasp (NGIT_PRIVATE_WRITE_RATE_*
#       knobs, shipped in Phase-4b alongside the
#       ngit_private_rate_limited_total{path} metric — src/metrics/mod.rs:336,
#       limiter src/private/rate.rs) — the inner, identity-aware layer;
#     * connection-count abuse detection (ngit_websocket_flagged_abusers).
#   The nginx zones below are the per-IP OUTER layer for the HTTP blob routes
#   only. If per-IP WS throttling is ever needed, it belongs in-server or via
#   a log-driven companion (fail2ban on 429s/closes), not in this file.
# =============================================================================


# =============================================================================
# SECTION A — HTTP context
#   Install as: /etc/nginx/conf.d/zz-ngit-grasp-zones.conf
# =============================================================================

# /upload (PUT/HEAD): per-client-IP token bucket.
limit_req_zone $binary_remote_addr zone=blobput:10m rate=10r/s;

# DELETE /<sha256>: key is EMPTY for every method except DELETE; nginx skips
# accounting for empty keys, so GET/HEAD blob downloads hitting the same
# location are NOT charged to this zone.
map $request_method $blobdel_key {
    default     "";
    DELETE      $binary_remote_addr;
}
limit_req_zone $blobdel_key zone=blobdel:10m rate=2r/s;

# Throttled requests answer 429 Too Many Requests (default is 503).
limit_req_status 429;


# =============================================================================
# SECTION B — SERVER context (inside the git.<domain> vhost)
#   Install as: /etc/nginx/conf.d/git.<domain>.d/ngit-grasp-zones.conf
#   Assumes the vhost already proxies location / to http://127.0.0.1:7334
#   with the WS upgrade headers; these blocks are more-specific matches.
# =============================================================================

# --- Blob upload (PUT /upload, HEAD /upload preflight) ----------------------
# Exact match wins over regex and prefix locations.
location = /upload {
    limit_req zone=blobput burst=20;

    # --- G6 streaming contract: do not regress ---
    client_max_body_size 0;        # no nginx-side size cap; server enforces
                                   # NGIT_PRIVATE_MAX_BLOB_BYTES itself
    proxy_request_buffering off;   # stream body to upstream, no spooling
    proxy_http_version 1.1;

    # Long timeouts: 256 MiB uploads on slow links must not be cut off
    # mid-stream, and post-upload hash verification can take a moment.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:7334;
}

# --- Blob fetch + delete (GET|HEAD|DELETE /<sha256>) ------------------------
# Regex match wins over the prefix `location /`. Only DELETE is charged to
# blobdel (see the map in SECTION A); GET/HEAD pass through uncharged.
location ~ ^/[0-9a-f]{64}$ {
    limit_req zone=blobdel burst=5;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:7334;
}

# --- Metrics -----------------------------------------------------------------
# /metrics exposes operational detail; restrict to localhost + your
# Prometheus host instead of the public internet. (If your Prometheus is
# remote, prefer scraping over the loopback via a tunnel, or add its IP.)
location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    # allow <prometheus-host-ip>;
    deny all;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:7334;
}
