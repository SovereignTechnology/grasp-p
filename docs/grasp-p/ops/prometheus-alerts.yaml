# =============================================================================
# ngit-grasp :: GRASP-P operations alert rules
# =============================================================================
# Load via `rule_files` in prometheus.yml (or a PrometheusRule CRD):
#
#   rule_files:
#     - /etc/prometheus/rules/ngit-grasp-private.yaml
#
# Metric sources: src/metrics/mod.rs (ngit_private_*), src/sync/metrics.rs
# (ngit_sync_*). Runbook anchors reference docs/grasp-p/ops/runbook.md (§3
# alert response playbook).
#
# Scrape target: the node's own metrics endpoint, NOT its public listener. A
# node with GRASP-P enabled answers /metrics on the public listener with a
# 404. It serves the scrape on the loopback address set in
# NGIT_GRASP_P_METRICS_BIND (for example 127.0.0.1:9464, path /metrics), and
# on no address at all while that setting is unset, which is the default:
# then no rule below has a series to read, and the only thing that can fire
# is the absent() arm of NgitSyncPeerDisconnected, for want of the peer's
# series. Loopback is not authentication, so run the collector on the node's
# host or in its network namespace. See the runbook, §3 "Where the scrape
# comes from".
#
# Relay labels: the scrape of a GRASP-P node names no relay by its URL. The
# `relay` label of the ngit_sync_* series holds an alias, peer-1, peer-2,
# ..., for the relays the operator configured as this node's peers: the
# entries of NGIT_GRASP_P_SYNC_PEER_URLS in the order written, then the relay
# in NGIT_SYNC_BOOTSTRAP_RELAY_URL unless the list already names it. On a
# pair, peer-1 on node A is node B and peer-1 on node B is node A; the
# `instance` label says which node a series came from, once each node's
# scrape sets its own (each is scraped on a loopback address, which can be
# the same on both). Every other relay the node dials has no series of its
# own in the scrape and is counted only in the aggregates
# (ngit_sync_relays_tracked_total, ngit_sync_relays_connected_total,
# ngit_sync_naughty_relays_total; ngit_sync_relays_dead_total is never
# updated by the server and reads 0). See the runbook, §3 "Relays in the
# scrape".
#
# NOT scrapeable (covered at the bottom of this file):
#   * NIP-11 private_repos.policy_fingerprint parity between peers
#   * kind-30641 manifest parity between peers
# Those need the external ngit-private-watchdog checker; see the comment
# block after the rule groups for the blackbox/textfile wiring pattern.
# =============================================================================

groups:
  # ---------------------------------------------------------------------------
  # GRASP-P private-repo subsystem
  # ---------------------------------------------------------------------------
  - name: ngit-grasp-private
    interval: 30s
    rules:
      # Mirror backlog: blobs referenced by synced manifests but not yet
      # fetched from the peer. A brief non-zero value is normal (fetch in
      # flight); sustained > 0 means the mirror is stuck or starved.
      - alert: NgitPrivateMirrorLag
        expr: ngit_private_mirror_lag_blobs > 0
        for: 15m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Private blob mirror backlog: {{ $value }} blobs unfetched"
          description: "ngit_private_mirror_lag_blobs has been > 0 for 15m. The gauge is set by the repair scan (every 60s), and a blob waiting out its retry backoff stays counted. Every failed fetch backs off, up to NGIT_GRASP_P_MIRROR_RETRY_MAX_SECS (1h by default) plus 20% jitter, so this alert, not NgitPrivateMirrorFailures, is the one that shows a blob that keeps failing. Read the reason in ngit_private_mirror_failed_total and in the 'private mirror' warn lines: no_peer, network or http_status = look at the peer set or the far side; quota, reserve or store = this node's own state; lag during known peer downtime is expected and heals by itself. After a fix the blob is fetched when its backoff ends; a restart clears every backoff."
          runbook: "docs/grasp-p/ops/runbook.md#mirror-lag"

      # Mirror fetch failures, split by the server's `reason` label.
      - alert: NgitPrivateMirrorFailures
        expr: sum by (reason) (rate(ngit_private_mirror_failed_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Private blob mirror fetches failing (reason={{ $labels.reason }})"
          description: "Mirror fetch failures in every 10m window for 10m with reason={{ $labels.reason }}. Each failed blob backs off (minutes, then up to NGIT_GRASP_P_MIRROR_RETRY_MAX_SECS), so a steady rate means many blobs are failing or new ones keep failing, not one blob retried in a loop; a few blobs that stay stuck go quiet here and show in NgitPrivateMirrorLag instead. A growing backlog plus failures usually means an unreachable or misconfigured peer, or a quota refusal on this node."
          runbook: "docs/grasp-p/ops/runbook.md#mirror-failures"

      # Registration conflicts. The metric's own help text: "Alert on any
      # increase: every conflict is either a split-brain heal or an attempted
      # alias/key squat." Page-worthy — no `for`, fire on the first increase.
      - alert: NgitPrivateRegistrationConflict
        expr: sum by (resolution) (increase(ngit_private_registration_conflicts_total[5m])) > 0
        labels:
          severity: critical
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Cross-tenant registration conflict (resolution={{ $labels.resolution }})"
          description: "The deterministic (created_at, id) merge resolved a conflict in the last 5m. stored_evicted = a previously accepted registration lost its seat; incoming_rejected = the arriving registration lost. Investigate both nodes for split-brain or squat attempts before the next sync round."
          runbook: "docs/grasp-p/ops/runbook.md#registration-conflict"

      # Global ledger budget pressure. The budget is CONFIG
      # (NGIT_GRASP_P_GLOBAL_BUDGET_BYTES, default 53687091200 = 50 GiB), not
      # a metric — keep the literal below in sync with the deployed value.
      - alert: NgitPrivateLedgerBudgetHigh
        # BUDGET: replace 53687091200 with the configured
        # NGIT_GRASP_P_GLOBAL_BUDGET_BYTES on the scraped host.
        expr: ngit_private_ledger_bytes{scope="global"} > 0.80 * 53687091200
        for: 30m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Private ledger at {{ $value | humanize1024 }}B (>80% of global budget)"
          description: "Global private-subsystem ledger exceeded 80% of NGIT_GRASP_P_GLOBAL_BUDGET_BYTES for 30m. Plan GC verification, tenant quota review, or a budget increase; new admissions start failing at 100%."
          runbook: "docs/grasp-p/ops/runbook.md#ledger-budget"

      - alert: NgitPrivateLedgerBudgetCritical
        # BUDGET: same literal as NgitPrivateLedgerBudgetHigh.
        expr: ngit_private_ledger_bytes{scope="global"} > 0.95 * 53687091200
        for: 15m
        labels:
          severity: critical
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Private ledger at {{ $value | humanize1024 }}B (>95% of global budget)"
          description: "Global private-subsystem ledger exceeded 95% of NGIT_GRASP_P_GLOBAL_BUDGET_BYTES for 15m. Admission refusals are imminent; act now (GC, offboard, quota enforcement, or raise the budget and update this rule)."
          runbook: "docs/grasp-p/ops/runbook.md#ledger-budget"

      # Admission rejection spike: possible flood, or a misconfigured client
      # hammering the relay with events it will never accept. Threshold is a
      # starting default — tune to the instance baseline; for per-kind
      # visibility use sum by (kind) (...).
      - alert: NgitPrivateAdmissionRejectionSpike
        expr: sum(rate(ngit_private_events_rejected_total[10m])) > 1
        for: 15m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Private admission rejections at {{ $value | humanize }}/s for 15m"
          description: "Sustained rejection rate above 1/s (10m avg). Check the kind label mix on /metrics: a single kind dominating suggests one misbehaving writer; a broad mix suggests a flood or a policy misconfiguration rejecting legit members."
          runbook: "docs/grasp-p/ops/runbook.md#admission-rejection-spike"

      # Server-side rate limiting (nginx outer layer + in-server per-write-key
      # token bucket; the metric ships in src/metrics/mod.rs:336 with labels
      # set at src/nostr/builder.rs:787-858 and src/http/blossom.rs:167-172).
      # Sustained limiting = active flood OR a legit client in a retry loop.
      - alert: NgitPrivateRateLimited
        expr: sum by (path) (increase(ngit_private_rate_limited_total[10m])) > 0
        for: 30m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Sustained rate limiting on path={{ $labels.path }}"
          description: "Clients have been continuously rate-limited on {{ $labels.path }} for 30m. If paired with NgitPrivateAdmissionRejectionSpike, treat as a flood (tighten the nginx zone in docs/grasp-p/ops/nginx-upload-zones.conf); if isolated, a legit client is likely misconfigured — identify via access logs before relaxing limits."
          runbook: "docs/grasp-p/ops/runbook.md#rate-limited"

      # Out-of-order hold saturated. An event that reaches a node before the
      # registration it depends on is rejected, kept in memory and retried
      # when the registration arrives. The hold is bounded (4096 events, a
      # byte budget of at least 32 MiB, 65,536 remembered ids); when a bound
      # is hit a new event is dropped. One that came from the peer comes back
      # when its registration is accepted or, at the latest, with the next
      # full re-issue, so replication of early events can slow from seconds
      # to up to NGIT_GRASP_P_FULL_REISSUE_INTERVAL_SECS. A synced event is
      # not lost for good; a client's own early event must be published
      # again.
      # reason="not_holdable" is left out on purpose: it counts rejections
      # no registration can cure (quota, shape, size), which is ordinary
      # traffic and already covered by NgitPrivateAdmissionRejectionSpike.
      # The series appear at their first increment, so the rule is inert on
      # a node whose hold has never overflowed.
      - alert: NgitPrivateHoldSaturated
        expr: sum by (reason) (increase(ngit_private_hold_dropped_total{reason=~"count_cap|byte_budget|skip_set_full"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Out-of-order hold is dropping events (reason={{ $labels.reason }})"
          description: "The in-memory hold for private events that arrive before their registration has been at a bound for 15m ({{ $labels.reason }}). Early events are dropped: one from the peer is fetched again when its registration is accepted or, at the latest, with the next full re-issue; one from a client must be published again. Usually a flood of events for unregistered aliases or keys; check the rejection mix and the source before anything else."
          runbook: "docs/grasp-p/ops/runbook.md#hold-saturated"

      # Upload slots of the node exhausted. A node serves at most 64 client
      # uploads at once; one more is answered 503 and counted here.
      # Refusals that keep coming for fifteen minutes mean clients cannot
      # push new content: either many accounts are holding slots with slow
      # or stalled uploads, or honest load is above 64 at once. Replication
      # does not wait for a slot (the blob mirror takes none) and nothing
      # stored is at risk.
      # The window is 10m and `for` is 15m so that one burst of refusals,
      # which keeps the expression above zero for ten minutes, does not
      # fire the alert.
      # The other reasons are left out on purpose: account_slots is one
      # account at its own cap, which is the cap working, and idle_timeout
      # and deadline are single uploads being cut, which happens whenever a
      # client loses its network.
      # The series appears at its first increment, so the rule is inert on
      # a node that has never been full.
      - alert: NgitPrivateUploadSlotsExhausted
        expr: increase(ngit_private_upload_refused_total{reason="node_slots"}[10m]) > 0
        for: 15m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Uploads are being refused: every upload slot of the node is taken"
          description: "Clients have repeatedly been answered 503 on PUT /upload over the last 15m because the node's 64 upload slots were all in use. Check ngit_private_upload_refused_total by reason: with idle_timeout or deadline rising too, slow or stalled uploads are holding the slots; alone, it is honest load. Clients do not retry by themselves."
          runbook: "docs/grasp-p/ops/runbook.md#upload-slots-exhausted"

      # Full re-issue silence (Phase-4b B1). The timer fires one since=None
      # re-issue round per NGIT_GRASP_P_FULL_REISSUE_INTERVAL_SECS (default
      # 3600, +-10% jitter; first fire one interval after boot). FS-8: a
      # round that delivered at least one peer increments
      # ngit_private_full_reissue_total; a round where every live peer was
      # skipped (rate-limit cooldown / FS-3 re-issue floor) increments
      # ngit_private_full_reissue_skipped_total instead. Silence of BOTH
      # over 2x the default interval = the self-heal timer is dead (a flat
      # delivered counter alone can be a legitimately floor-skipped peer).
      # NOTE: the series appear at their first increment — if the timer
      # never fired since boot this rule is inert; add
      # `or (absent(ngit_private_full_reissue_total) and absent(ngit_private_full_reissue_skipped_total))`
      # for boot-silence detection, and DROP this rule entirely if you run
      # NGIT_GRASP_P_FULL_REISSUE_INTERVAL_SECS=0 (disabled) — flat counters
      # are expected then. If you tune the interval, scale the window to 2x
      # the deployed value. Sustained increases of
      # ngit_private_full_reissue_skipped_total alone = a chronically-skipped
      # peer (see the metric help): check the FS-3 floor
      # (NGIT_GRASP_P_REISSUE_MIN_INTERVAL_SECS) and peer health.
      - alert: NgitPrivateFullReissueSilent
        expr: increase(ngit_private_full_reissue_total[2h]) == 0 and increase(ngit_private_full_reissue_skipped_total[2h]) == 0
        for: 30m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Private full re-issue timer silent for >2h"
          description: "Neither ngit_private_full_reissue_total nor ngit_private_full_reissue_skipped_total has increased over 2x the default re-issue interval — the timer itself is not firing. Redelivery-dependent sync gaps (expired rejected-hot-cache entries, cadence-limited 30640 rejections, negentropy blind spots) stop healing; expect slow divergence until the timer or process is restored."
          runbook: "docs/grasp-p/ops/runbook.md#full-re-issue-silent"

      # Denylist entries dropped (Phase-4b D1). The gauge is set at boot and
      # on every reload swap; any decrease means files were edited (intended)
      # or went missing/shrunk (unintended). A drop to 0 on a node that
      # should be enforcing a takedown list = the files are gone (metric help
      # text, src/metrics/mod.rs:367-379). Already-purged bytes stay gone
      # either way; reads re-open for anything still stored.
      - alert: NgitPrivateDenylistEntriesDropped
        expr: delta(ngit_private_denylist_entries[1h]) < 0
        for: 5m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "Private denylist shrank by {{ $value | humanize }} entries in 1h"
          description: "ngit_private_denylist_entries decreased. If you did not edit the denylist files, treat as missing files (mount/permission drift) — taken-down content still on disk becomes readable again after one reload interval."
          runbook: "docs/grasp-p/ops/runbook.md#denylist-entries-dropped"

      # Denylist purge happened (Phase-4b D1/D2). Informational page: every
      # increase is a takedown action (reload purge-on-add or GC denylist
      # sweep) — confirm it was intended. No `for`: fire on the first
      # increase so an unexpected purge is caught immediately.
      - alert: NgitPrivateDenylistPurged
        expr: increase(ngit_private_denylist_purged_total[10m]) > 0
        labels:
          severity: info
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "{{ $value | humanize }} private blob(s) purged via denylist"
          description: "A takedown purge ran (reload purge-on-add or the GC denylist sweep). Confirm the denylist addition was intended and work the takedown runbook; an unexpected purge means the denylist files carry hashes you did not put there."
          runbook: "docs/grasp-p/ops/runbook.md#denylist-purged"

      # NIP-56 report intake (Phase-4b D3). Kind-1984 events are
      # intake-logged (event id, reporter, sha256-looking tags; content never
      # logged) and v1 takes NO automatic action — a rising count is a page
      # to work the manual takedown runbook.
      - alert: NgitPrivateReportEvents
        expr: increase(ngit_private_report_events_total[1h]) > 0
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p
        annotations:
          summary: "{{ $value | humanize }} NIP-56 report event(s) in 1h"
          description: "Kind-1984 reports are arriving. Pull the intake log lines (event_id, reporter, sha256_tags), verify the evidence per the takedown runbook (decrypt-to-confirm), then denylist if actionable."
          runbook: "docs/grasp-p/ops/runbook.md#report-events"

  # ---------------------------------------------------------------------------
  # Sync health (GRASP-02 proactive sync; private L1 sync rides these conns)
  # ---------------------------------------------------------------------------
  - name: ngit-grasp-sync
    interval: 30s
    rules:
      # A configured peer is disconnected, or the node has no series for it.
      # ngit_sync_relay_connected is a state gauge per relay: 0=disconnected,
      # 1=connecting, 2=syncing, 3=connected,
      # 4=connected_historic_sync_failures. < 2 for 10m (disconnected, or a
      # dial in progress) means the node has had no session with the peer for
      # that long. The gauge reads 1 while a dial runs, and a down peer is
      # dialled every 5 minutes, so == 0 would restart the 10 minutes
      # whenever a scrape met a dial. `* 0` keeps the value of this arm at 0.
      # The selector takes the peers only (see "Relay labels" at the top of
      # this file).
      #
      # The absent() arm: the first arm cannot fire on a series that is not
      # there, and a peer has none while the node does not track it. Its URL is
      # missing or wrong in both settings, or the node refused the address of
      # a listed peer. Without the arm each of those reads as a healthy peer.
      # A peer the node has once tracked keeps its series: an ended session
      # or a failed dial leaves it tracked, at 0 (1 during a dial), and the
      # node redials it at least every 5 minutes.
      #   * The arm names peer-1, the one peer of a pair. A node with more
      #     peers repeats it per alias: `or absent(...{relay="peer-2"})`.
      #   * absent() looks at all the series the evaluating server holds, not
      #     at one node. With a collector per node, which is what a loopback
      #     endpoint leads to, that is one node. Where a single server
      #     evaluates these rules for both nodes, repeat the arm per node
      #     with an `instance` matcher:
      #     `or absent(...{relay="peer-1",instance="<node A>"})
      #      or absent(...{relay="peer-1",instance="<node B>"})`.
      #     Otherwise the arm fires only when both nodes lack the series.
      #   * The alert from the arm carries the labels of its matchers only:
      #     `relay`, and `instance` where the arm has that matcher.
      #   * The arm also fires while the node is not scraped at all.
      #   * A node that runs without a peer has no peer-1. A node with
      #     GRASP-P off labels these series with relay URLs, so it has no
      #     peer-1 either. On both the arm fires all the time: drop the
      #     rule there.
      # $value tells the two arms apart, and the description prints it: 0 is
      # a tracked peer with no session, 1 is a peer with no series.
      - alert: NgitSyncPeerDisconnected
        expr: (ngit_sync_relay_connected{relay=~"peer-.+"} < 2) * 0 or absent(ngit_sync_relay_connected{relay="peer-1"})
        for: 10m
        labels:
          severity: warning
          service: ngit-grasp
          component: grasp-p-sync
        annotations:
          summary: "Sync peer {{ $labels.relay }} disconnected or missing from the scrape for 10m"
          description: "Alert value {{ $value }}. For 10m, ngit_sync_relay_connected for {{ $labels.relay }} has been below 2 (alert value 0: the peer is tracked and has no session: disconnected, or being dialled) or absent from the scrape (alert value 1: the node tracks no such peer, or is not scraped). {{ $labels.relay }} is an alias, not a URL: on a pair, peer-1 is the other node. For GRASP-P two-node replication this halts 30640/30641 sync and grows the mirror backlog. Value 0: check the peer process, DNS/TLS and the network path; the node's own log names the relay and its last error. The node redials a disconnected peer by itself, at least every 5 minutes, so the alert clears once the peer can be reached. Value 1: check NGIT_GRASP_P_SYNC_PEER_URLS and NGIT_SYNC_BOOTSTRAP_RELAY_URL on the node, and that the node is scraped."
          runbook: "docs/grasp-p/ops/runbook.md#sync-peer-disconnected"

      # All tracked peers disconnected simultaneously — almost always a LOCAL
      # outage (network, DNS, sync subsystem), not a mass peer failure.
      - alert: NgitSyncAllPeersDisconnected
        expr: ngit_sync_relays_connected_total == 0 and ngit_sync_relays_tracked_total > 0
        for: 10m
        labels:
          severity: critical
          service: ngit-grasp
          component: grasp-p-sync
        annotations:
          summary: "No sync peers connected ({{ $value }} tracked)"
          description: "ngit_sync_relays_connected_total == 0 while peers are configured, for 10m. The node is fully partitioned from its replication set; treat as a local outage until proven otherwise."
          runbook: "docs/grasp-p/ops/runbook.md#sync-all-disconnected"

      # No rule reads ngit_sync_relay_failures. The server registers that
      # gauge and nothing sets it, so the series is in no scrape. The rule
      # that stood here, NgitSyncPeerFailuresGrowing, read it and could never
      # fire; with an absent() arm it would fire for good. A peer whose dials
      # keep failing is disconnected, and NgitSyncPeerDisconnected covers
      # that. The health of a peer is in
      # ngit_sync_relay_status{relay="peer-N"} (1=healthy, 2=disconnected,
      # 3=degraded, 4=dead, 5=rate_limited, 6=policy_limited), which the
      # server sets on every health check.

# =============================================================================
# NOT SCRAPEABLE: policy_fingerprint parity + 30641 manifest parity
# =============================================================================
# Cross-node parity of the NIP-11 `private_repos.policy_fingerprint` and of
# kind-30641 blob manifests is checked by the EXTERNAL watchdog
# (ngit-private-watchdog — compares two nodes' adverts/manifests and exits
# non-zero on divergence). It is not a /metrics series, so alerting on it
# requires one of these bridges:
#
# (a) blackbox-style: run the watchdog as a scheduled probe and expose the
#     result as a probe metric, e.g. via a tiny exporter or prometheus
#     pushgateway:
#       ngit_private_watchdog_exit_status{check="policy_fingerprint"} 0|1
#       ngit_private_watchdog_exit_status{check="manifest_parity"}    0|1
#     then alert:
#       - alert: NgitPrivateWatchdogFailing
#         expr: ngit_private_watchdog_exit_status != 0
#         for: 30m
#         labels: {severity: critical, service: ngit-grasp, component: grasp-p}
#         annotations:
#           summary: "Watchdog check {{ $labels.check }} failing"
#           runbook: "docs/grasp-p/ops/runbook.md#watchdog"
#
# (b) node-exporter textfile collector: cron the watchdog and write
#     /var/lib/node_exporter/textfile_collector/ngit_private_watchdog.prom:
#       ngit_private_watchdog_exit_status{check="policy_fingerprint"} 0
#       ngit_private_watchdog_exit_status{check="manifest_parity"} 0
#       ngit_private_watchdog_last_run_timestamp 1753500000
#     same alert as (a), plus a staleness guard so a dead cron is caught:
#       - alert: NgitPrivateWatchdogStale
#         expr: time() - ngit_private_watchdog_last_run_timestamp > 7200
#         for: 15m
#         labels: {severity: warning, service: ngit-grasp, component: grasp-p}
#         annotations:
#           summary: "Watchdog has not reported in >2h"
#           runbook: "docs/grasp-p/ops/runbook.md#watchdog"
#
# Add an absent(ngit_private_watchdog_exit_status) guard if you want a page
# when the bridge was never deployed. Either way, a divergence page means
# split-brain or operator-side withholding — see the threat model in
# docs/grasp-p/plan-v2-fix-log.md (T1) before mutating either node.
# =============================================================================
