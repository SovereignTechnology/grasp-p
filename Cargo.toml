[package]
name = "ngit-grasp"
version = "1.2.0"
edition = "2021"
authors = ["ngit-grasp contributors"]
license = "MIT"
description = "A GRASP (Git Relays Authorized via Signed-Nostr Proofs) implementation in Rust"
repository = "https://gitworkshop.dev/danconwaydev.com/ngit-grasp"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP server (hyper for relay integration)
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
http-body-util = "0.1"

# Nostr relay
nostr-relay-builder = "0.45.0-alpha.3"

# Nostr
nostr = "0.45.0-alpha.3"
nostr-sdk = "0.45.0-alpha.3"
nostr-lmdb = "0.45.0-alpha.3"
nostr-memory = "0.45.0-alpha.3"

# Utilities
futures-util = "0.3"
base64 = "0.22"
flate2 = "1.0"
tar = "0.4"
fs2 = "0.4"

# Metrics
prometheus = "0.14"
dashmap = "6"
lazy_static = "1.4"

# Data structures
indexmap = "2"

# Random (for startup jitter)
rand = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# Temporary directories (used for GRASP-06 empty-repo synthesis)
tempfile = "3"

# GRASP-P private repos: meta store (same heed version nostr-lmdb pins),
# small sync primitives, and temp-file names for streamed blob uploads.
# sha256/hex come from the `nostr` re-export of bitcoin_hashes (already compiled).
# NOTE (follow-up C3): these "serde"/"serde-json" features unify (Cargo feature
# union) onto the heed that nostr-lmdb pins for the relay core store. This
# assumes both crates continue to share one heed version; the features are
# additive and unused by nostr-lmdb (benign today). If nostr-lmdb ever moves to
# a different heed major, revisit rather than relying on this shared-version
# assumption. Left as documentation only — no refactor.
heed = { version = "0.20", default-features = false, features = ["serde", "serde-json"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

# GRASP-P Phase 2 blob mirror: pull peer blobs over the existing public
# GET /<sha256> route (plain http for tests, https in production).
# rustls (not native-tls) keeps openssl/openssl-sys out of the shipped
# relay binary — master used rustls via nostr-sdk; native-tls was dev-only.
# The mirror only uses GET + Response::chunk(), so no stream/gzip/http2/json
# features are needed.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# GRASP-P Phase 4b: exact-host URL matching for domain references in 30640
# tags / peer allowlists (already compiled transitively via reqwest).
url = "2"

# Git (for future use)
# git-http-backend = "0.3"

[dev-dependencies]
# Testing
grasp-audit = { path = "grasp-audit", version = "0.2.0" }
tempfile = "3"

[lib]
name = "ngit_grasp"
path = "src/lib.rs"

[[bin]]
name = "ngit-grasp"
path = "src/main.rs"

# Phase-4b WP-F: external split-view watchdog for GRASP-P two-node pairs.
[[bin]]
name = "ngit-private-watchdog"
path = "src/bin/ngit-private-watchdog.rs"

[[test]]
name = "nip09_announcement_cascade"
path = "tests/lifecycle/nip09_announcement_cascade.rs"

[[test]]
name = "nip09_blacklist_ops"
path = "tests/lifecycle/nip09_blacklist_ops.rs"

[[test]]
name = "nip09_cascade_event_types"
path = "tests/lifecycle/nip09_cascade_event_types.rs"

[[test]]
name = "nip09_disrespector"
path = "tests/lifecycle/nip09_disrespector.rs"

[[test]]
name = "nip09_git_archive_cleanup"
path = "tests/lifecycle/nip09_git_archive_cleanup.rs"

[[test]]
name = "nip09_holding_cleanup"
path = "tests/lifecycle/nip09_holding_cleanup.rs"

[[test]]
name = "nip09_holding_db"
path = "tests/lifecycle/nip09_holding_db.rs"

[[test]]
name = "nip09_multi_maintainer"
path = "tests/lifecycle/nip09_multi_maintainer.rs"

[[test]]
name = "nip09_recovery"
path = "tests/lifecycle/nip09_recovery.rs"

[[test]]
name = "nip09_state_cascade"
path = "tests/lifecycle/nip09_state_cascade.rs"

[[test]]
name = "nip09_state_multi_maintainer"
path = "tests/lifecycle/nip09_state_multi_maintainer.rs"

[[test]]
name = "nip09_validation"
path = "tests/lifecycle/nip09_validation.rs"

[[test]]
name = "deletion_request_retention"
path = "tests/lifecycle/deletion_request_retention.rs"

[[test]]
name = "nip62_lifecycle"
path = "tests/lifecycle/nip62_lifecycle.rs"

[[test]]
name = "nip62_validation"
path = "tests/lifecycle/nip62_validation.rs"

[[test]]
name = "replaceable_history"
path = "tests/lifecycle/replaceable_history.rs"

[workspace]
members = [".", "grasp-audit"]
