# ngit-ci currently evaluates push path filters but not pull-request path
# filters, so PRs run this workflow unconditionally.
on:
  push:
    paths:
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "build.rs"
      - "compose*.yaml"
      - "deploy/**"
      - "scripts/build-container-layout.sh"
      - "scripts/test-container-deployment.sh"
      - "scripts/test-container-release.sh"
      - "src/**"
  pull_request:

name: Container deployment e2e

jobs:
  container-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Require the disposable guest container daemon
        run: |
          if [[ ! -S /var/run/docker.sock ]]; then
            echo "container daemon socket is not available" >&2
            echo "this workflow requires an ngit-ci operator opt-in" >&2
            exit 1
          fi
      - name: Build, import, replace, and verify the OCI release layout
        shell: bash
        run: |
          set -euo pipefail

          version="$(nix eval --raw .#static.version)"
          revision="$(git rev-parse 'HEAD^{commit}')"
          nix shell nixpkgs#docker-client nixpkgs#curl nixpkgs#jq nixpkgs#skopeo \
            --command scripts/test-container-release.sh "$version" "$revision"
