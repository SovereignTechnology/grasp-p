version: 1
system: x86_64-linux
name: Rust CI
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "work/**"
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    steps:
      - dependencies: {build: packages.x86_64-linux.ci-dependencies}
      - release-scripts: {build: checks.x86_64-linux.release-scripts}
      - release-cli: {build: checks.x86_64-linux.release-cli}
      - format
      - compile
      - lint
      - tests
