services:
  ngit-grasp:
    environment:
      NGIT_TRUSTED_PROXY_CIDRS: "${NGIT_CADDY_IP:-172.30.73.2}/32"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      ngit-grasp:
        condition: service_healthy
    environment:
      NGIT_DOMAIN: "${NGIT_DOMAIN:?copy deploy.env.example to .env and set NGIT_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      backend:
        ipv4_address: "${NGIT_CADDY_IP:-172.30.73.2}"

volumes:
  caddy-data:
  caddy-config:
